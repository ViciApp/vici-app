name: Dependabot Bun Lockfile

# Dependabot supports bun for version updates but NOT for security updates
# (https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories),
# and a backend security alert opens its PR regardless of dependabot.yml. Such
# a PR bumps backend/package.json and leaves backend/bun.lock stale, which
# breaks `bun install --frozen-lockfile` in Backend Checks and in the Fly image
# build (see #1242 then #1245). This job regenerates the lockfile in place so
# the security PR is mergeable on its own.
#
# `pull_request_target` is deliberate: a workflow triggered by Dependabot
# through `pull_request` gets a read-only token and no secrets, so it cannot
# push the fix back. The workflow definition is read from the base branch, and
# the only command run against the PR's contents is
# `bun install --lockfile-only`, which resolves the registry without installing
# packages or running any lifecycle script.

on:
  pull_request_target:
    paths:
      - 'backend/package.json'

permissions: {}

concurrency:
  group: dependabot-bun-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Same-repo Dependabot branches only: a fork cannot be pushed to, and a
    # human-authored PR is expected to carry its own lockfile.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Nothing uses GITHUB_TOKEN here; checkout and push both run on the
    # short-lived app installation token minted below, which is what gets
    # Backend Checks to re-run on the fixed head.
    permissions: {}
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Resolved inside the same pinned image Backend Checks runs, so the
      # lockfile written here is byte-identical to the one that job then
      # verifies with `--frozen-lockfile`. The image is not used as the job
      # `container:` because it ships without git, which the steps below need.
      - name: Regenerate bun.lock
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/backend \
            oven/bun:1.3 \
            bun install --lockfile-only

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain backend/bun.lock)" ]]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      # Committed with plain git rather than .github/actions/add-and-commit:
      # under `pull_request_target` the checked-out tree is PR-controlled, so
      # this step must not execute action code read back out of it.
      - name: Commit and push the regenerated lockfile
        if: steps.check_changes.outputs.changes_detected == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'vici-release-bot[bot]'
          git config user.email 'vici-release-bot[bot]@users.noreply.github.com'
          git add backend/bun.lock
          git commit -m 'chore(backend-deps): regenerate bun.lock for the dependency bump'
          git push "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
