name: E2E (web2)

# The web2 build (VITE_BACKEND=web2) end to end against the real API in
# backend/ on a throwaway Postgres. Runs on every pull request and every push
# to main, with no path filter: the suite spans the frontend, the backend and
# their contract, so any change can break it. The API runs through its E2E
# entrypoint (backend/e2e/server.ts): the engine and the VXP ledger are
# deterministic fakes and email stays in memory, so the job needs no secrets
# and never reaches mainnet. See docs/ai/frontend/testing.md.

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push supersedes the run on a PR; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-web2:
    name: web2 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vici
          POSTGRES_PASSWORD: vici
          POSTGRES_DB: vici
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgres://vici:vici@localhost:5432/vici
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node + npm cache + npm ci + svelte-kit sync.
      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('backend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The browser binary comes from the cache; its system libraries do not.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.web2.config.ts boots both servers: the API (migrate, seed,
      # then the E2E entrypoint) and the web2 production bundle under
      # `vite preview`.
      - name: Run web2 E2E
        run: npm run e2e:web2

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-web2
          path: playwright-report-web2/
          retention-days: 7

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-web2
          path: test-results-web2/
          retention-days: 7
