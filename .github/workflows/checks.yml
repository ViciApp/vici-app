name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    # No API access needed — the title comes from the event payload, not the API.
    permissions: {}
    steps:
      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR title check only runs for pull_request events."

      - name: Validate Conventional Commit PR title (scope required)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Scope is REQUIRED: type(scope): description — or type(scope)!: … for a breaking change.
          pattern='^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title OK."
            exit 0
          fi

          # Keep the title off the start of a line so it can't inject a ::workflow:: command.
          echo "::error::PR title must be a Conventional Commit WITH A SCOPE: 'type(scope): description' (or 'type(scope)!: …' for a breaking change)."
          echo "::error::Scope = the affected area/package, or a short area such as 'deps' for tooling. E.g. 'feat(market): add filters'."
          echo "Got title: $PR_TITLE"
          exit 1

  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Mint app token
        id: app-token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ steps.app-token.outputs.token != '' && github.event_name == 'pull_request' }}

      - name: Checkout for pull request
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore Prettier Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: ${{ runner.os }}-prettier-cache-format-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-prettier-cache-format-main-
            ${{ runner.os }}-prettier-cache-format-

      - name: Restore ESLint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-cache-format-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-format-main-
            ${{ runner.os }}-eslint-cache-format-

      - name: Format
        run: npm run format

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit format
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true' && steps.check_changes.outputs.changes_detected == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          message: '🤖 Apply formatting changes'
          token: ${{ steps.app-token.outputs.token }}

      - name: Fail for formatting issues without a bot token
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false' && steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "Formatting changes are needed but couldn't be committed because the bot app token isn't available (fork pull request) or this isn't a pull request. Run 'npm run format' locally and commit the result."
          exit 1

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore Prettier Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: ${{ runner.os }}-prettier-cache-lint-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-prettier-cache-lint-main-
            ${{ runner.os }}-prettier-cache-lint-

      - name: Restore ESLint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-cache-lint-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-lint-main-
            ${{ runner.os }}-eslint-cache-lint-

      - name: Lint
        run: npm run lint

  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Check
        run: npm run check

  satellite-schema:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore Prettier Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: ${{ runner.os }}-prettier-cache-quality-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-prettier-cache-quality-main-
            ${{ runner.os }}-prettier-cache-quality-

      - name: Restore ESLint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-cache-quality-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-quality-main-
            ${{ runner.os }}-eslint-cache-quality-

      # Install the juno CLI directly instead of using `junobuild/juno-action@full`.
      # The docker image bundles its own toolchain — at the time of writing it
      # ships `@icp-sdk/bindgen@0.3.0` while our `package.json` devDep is `^0.4.0`,
      # AND it fails to enumerate the `defineQuery` / `defineUpdate` exports from
      # `src/satellite/index.ts` (it rewrites `satellite_extension.did` as
      # `service : {}`). Both make the drift check a permanent false positive.
      # The npm-installed CLI runs against our own `node_modules`, picks up the
      # right bindgen, and reproduces the local build output byte-for-byte.
      # Pin to a known-good version (same as `e2e.yml`); bump deliberately.
      - name: Install Juno CLI
        run: npm i -g @junobuild/cli@0.15.6

      - name: Regenerate satellite Candid surface
        run: npm run juno:functions:build

      - name: Quality
        run: npm run quality

      - name: Fail if satellite Candid / declarations drifted
        run: |
          drift_paths=(
            src/satellite/satellite.did
            src/satellite/satellite_extension.did
            src/satellite/api-schemas.ts
            src/declarations/satellite
          )
          if [[ -n "$(git status --porcelain -- "${drift_paths[@]}")" ]]; then
            echo "::error::Satellite schema/.did/declarations are out of date. Run 'npm run juno:functions:build && npm run quality' locally and commit the result. Diff follows:"
            git --no-pager diff --stat -- "${drift_paths[@]}"
            git --no-pager diff -- "${drift_paths[@]}"
            exit 1
          fi

  # Regenerates the engine Candid bindings from the pinned ICDC_CORE_VERSION, so
  # a version bump (by hand or by update-icdc-core.yml) never needs a manual
  # `npm run did`. Same-repo PRs get the result committed back; elsewhere any
  # drift fails the job.
  bindings:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Mint app token
        id: app-token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ steps.app-token.outputs.token != '' && github.event_name == 'pull_request' }}

      - name: Checkout for pull request
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      # No prettier/eslint cache here: this job checks out the PR head with the
      # bot token, and a cache it saves could be restored on main (CodeQL
      # cache poisoning). The price is an uncached format pass in did.sh.
      - name: Regenerate Candid bindings
        run: ./scripts/did.sh

      # did.sh formats the whole tree; only the bindings are this job's concern
      # (the `format` job owns everything else).
      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain -- src/declarations backend/src/declarations)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit bindings
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true' && steps.check_changes.outputs.changes_detected == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          add: src/declarations backend/src/declarations
          message: '🤖 chore(declarations): apply bindings changes'
          token: ${{ steps.app-token.outputs.token }}

      - name: Fail for binding drift without a bot token
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false' && steps.check_changes.outputs.changes_detected == 'true'
        run: |
          echo "::error::The Candid bindings don't match ICDC_CORE_VERSION and couldn't be committed because the bot app token isn't available (fork pull request) or this isn't a pull request. Run 'npm run did' locally and commit the result. Diff follows:"
          git --no-pager diff --stat -- src/declarations backend/src/declarations
          git --no-pager diff -- src/declarations backend/src/declarations
          exit 1

  checks-pass:
    if: always()
    needs: ['pr-title', 'format', 'lint', 'check', 'satellite-schema', 'bindings']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
