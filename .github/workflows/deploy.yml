name: Deploy to Juno

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Shared `juno-satellite` group with publish.yml: both mutate the same
# satellite canister and must not overlap (`functions upgrade` stops it
# mid-run, so a concurrent mutation is rejected with "Canister is stopped").
# A `v*` tag fires both workflows, so the shared group serializes them.
# cancel-in-progress: false → queue, never cancel a running one.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify JUNO_TOKEN is set
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::JUNO_TOKEN secret is not set. Generate an Administrator access key in the Juno Console and add it as the JUNO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: the satellite-change check below diffs
          # against the previous `v*` release tag.
          fetch-depth: 0

      - name: Prepare
        uses: ./.github/actions/prepare

      # `functions upgrade` STOPS the satellite while the wasm is swapped —
      # and the same canister serves the frontend, so users get the HTTP
      # gateway's "canister is stopped" page for the whole window. Skip the
      # upgrade when nothing feeding the satellite wasm changed since the
      # previous release: the script walks the real import graph of
      # `src/satellite/index.ts` (incl. shared `$lib/**` schemas/types), so a
      # frontend-only release ships through the zero-downtime
      # `hosting deploy` alone. Any doubt — no previous tag, script failure,
      # unresolved import — fails safe to upgrading.
      - name: Check whether the satellite wasm changed
        id: satellite
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            base="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          else
            base="$(git describe --tags --match 'v*' --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          if [ -z "${base}" ]; then
            echo "No previous v* tag found — defaulting to upgrade."
            upgrade=true
          elif ! upgrade="$(node scripts/satellite-upgrade-needed.mjs --base "${base}")"; then
            echo "satellite-upgrade-needed.mjs failed — defaulting to upgrade."
            upgrade=true
          fi
          # Only an explicit `false` skips the upgrade — any other output
          # (empty, garbled) is treated as "upgrade" so a script bug can
          # never silently skip a required wasm swap.
          if [ "${upgrade}" != "true" ] && [ "${upgrade}" != "false" ]; then
            echo "Unexpected script output '${upgrade}' — defaulting to upgrade."
            upgrade=true
          fi
          echo "base=${base:-<none>} upgrade=${upgrade}"
          echo "upgrade=${upgrade}" >> "$GITHUB_OUTPUT"

      - name: Build functions
        if: steps.satellite.outputs.upgrade == 'true'
        uses: junobuild/juno-action@93149e31c67f45835953ed2e1abe0e910af625fc # v0.7.5-full
        with:
          args: functions build
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}

      - name: Upgrade functions
        if: steps.satellite.outputs.upgrade == 'true'
        uses: junobuild/juno-action@93149e31c67f45835953ed2e1abe0e910af625fc # v0.7.5-full
        with:
          args: functions upgrade
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}

      # `functions upgrade` can exit 0 without swapping the module, so a green
      # step proves nothing. Stop before `hosting deploy` when the canister
      # is not running the wasm this run built.
      - name: Verify the satellite runs the new wasm
        if: steps.satellite.outputs.upgrade == 'true'
        run: node scripts/verify-satellite-upgrade.mjs --satellite 7scay-7yaaa-aaaal-asxqa-cai

      # `--prune` deletes superseded content-hashed assets. Without it `#dapp`
      # grows every deploy until asset certification exceeds the IC's
      # 40B-instruction message limit and the site 503s ("Invalid tree root hash").
      - name: Deploy to Juno
        uses: junobuild/juno-action@99d76780c60c023b5396298f94a7264e0c7ee2b5 # main
        with:
          args: hosting deploy --prune
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
