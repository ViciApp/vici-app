# nginx drops every inherited add_header in a location that sets one of its
# own, so the per-path Cache-Control is chosen here and every header is set
# once, at server level, where all locations inherit it. $uri is the final one
# after try_files, so the SPA fallback gets the index.html policy. An empty
# value adds no header.
map $uri $cache_control {
    # SvelteKit's hashed, content-addressed bundles never change: cache them hard.
    ~^/_app/immutable/  "public, max-age=31536000, immutable";
    # The app shell must never be cached: it references hashed bundles, so a
    # stale cached index.html would point at bundles that no longer exist after
    # a deploy and break the load.
    /index.html         "no-cache, no-store, must-revalidate";
    default             "";
}

# A challenge link (/c/<id>) previews with the challenge's own title and
# description: messengers read a link's <head> without running the app, so
# nginx fills it with a fragment the API renders, through an SSI include in
# the app shell (src/app.html). On a timeout, an error or an unknown id the
# include falls back to the shell's generic preview tags; the page loads either
# way. See docs/ai/frontend/seo.md. The id pattern mirrors
# src/lib/constants/challenge.constants.ts (Crockford base32, 16 characters),
# matched case-insensitively because the API accepts a lowercase id.
#
# The fragment's origin (CHALLENGE_HEAD_UPSTREAM) and the machine's own DNS
# resolver are filled in when the container starts (Dockerfile.web). A
# variable in proxy_pass is resolved per request, so an API DNS hiccup at boot
# never keeps the site from starting. The origin is the API's public address,
# reached over IPv4.
resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
resolver_timeout 500ms;

# One render per id a minute at most: a link that goes viral costs the API one
# request a minute. A fragment is under 2 KB, so 1 MB of keys and 8 MB of
# bodies hold thousands of ids.
proxy_cache_path /var/cache/nginx/challenge_head levels=1:2 keys_zone=challenge_head:1m
    max_size=8m inactive=10m use_temp_path=off;

# Fly's proxy is every request's peer, so the visitor is the Fly-Client-IP
# header; a request without it (a local run) falls back to the peer.
map $http_fly_client_ip $challenge_client {
    ""      $binary_remote_addr;
    default $http_fly_client_ip;
}

# Bounds a preview storm per visitor: a person opens a link once and a
# messenger fetches it once per share, so 30 a minute with a burst of 60 never
# meets either. Past it the visitor still gets the page, with the generic
# preview (see the /c/ location).
limit_req_zone $challenge_client zone=challenge_links:10m rate=30r/m;

# A challenge page is one visitor's view of a link, not a page for search.
map $request_uri $robots_tag {
    ~^/c/   "noindex, nofollow";
    default "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No `always` here: a 404 under /_app/immutable/ must not be cached for a year.
    add_header Cache-Control $cache_control;

    # Fly terminates TLS and force_https redirects plain HTTP, so every browser
    # sees these over HTTPS. Same values as the API at api.vici.app.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Same policy as the web3 build of this app at vici.market.
    add_header Referrer-Policy "same-origin" always;
    # Nothing frames the app. X-Frame-Options covers browsers without CSP
    # frame-ancestors support.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Robots-Tag $robots_tag always;

    location /_app/immutable/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # A challenge link: the app shell with SSI on, so its include of the head
    # fragment runs. try_files serves the shell in this location (an internal
    # redirect would land in the SSI-less `= /index.html` one); $uri becomes
    # /index.html, so the shell's no-store Cache-Control applies.
    location ~* "^/c/(?<challenge_id>[0-9A-HJKMNP-TV-Z]{16})/?$" {
        limit_req zone=challenge_links burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = /index.html;
        ssi on;
        try_files /index.html =404;
    }

    # The fragment, reachable only from the include above. The visitor's
    # headers (cookies included) never reach the API.
    location ~ "^/__challenge_head/(?<head_id>[0-9A-Za-z]{16})$" {
        internal;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Accept "text/html";
        proxy_ssl_server_name on;
        # The include holds up the page of every visitor on a cache miss, so
        # a slow API costs at most this and the preview, never the page.
        proxy_connect_timeout 500ms;
        proxy_send_timeout 500ms;
        proxy_read_timeout 800ms;
        # Another address only when one refuses the connection: a retry after
        # a timeout would double the wait.
        proxy_next_upstream error;
        proxy_next_upstream_timeout 1s;
        proxy_cache challenge_head;
        proxy_cache_key $head_id;
        proxy_cache_valid 200 404 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 1s;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        # Anything but a fragment becomes an empty body, which makes the
        # include emit the generic preview block.
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @challenge_head_fallback;
        proxy_pass ${CHALLENGE_HEAD_UPSTREAM}/api/v1/challenges/$head_id/head;
    }

    location @challenge_head_fallback {
        return 204;
    }

    # SPA fallback: any unmatched path serves index.html so client-side routing
    # and deep links / hard reloads resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
