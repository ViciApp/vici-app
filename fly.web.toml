# VICI SPA (static, nginx) on Fly.io, served at vici.app. Sibling to the
# backend app (vici-app-backend, api.vici.app); see Dockerfile.web. Deployed by
# the manual workflow .github/workflows/web2-deploy.yml.
app = "vici-app-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    # This image is the web2 site only; the web3 bundle keeps shipping to
    # vici.market through the Juno deploy, which never reads this file.
    VITE_WEB2_API_URL = "https://api.vici.app"
    VITE_BACKEND = "web2"

# Keep one machine warm: the SPA gets no benefit from scale-to-zero, and a
# cold-stopped machine that wedges is invisible to Fly without a health check.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

# nginx serves index.html on `/` (HTTP 200), so `/` doubles as the liveness probe.
[[http_service.checks]]
  method = "get"
  path = "/"
  interval = "15s"
  timeout = "2s"
