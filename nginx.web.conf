# nginx drops every inherited add_header in a location that sets one of its
# own, so the per-path Cache-Control is chosen here and every header is set
# once, at server level, where all locations inherit it. $uri is the final one
# after try_files, so the SPA fallback gets the index.html policy. An empty
# value adds no header.
map $uri $cache_control {
    # SvelteKit's hashed, content-addressed bundles never change: cache them hard.
    ~^/_app/immutable/  "public, max-age=31536000, immutable";
    # The app shell must never be cached: it references hashed bundles, so a
    # stale cached index.html would point at bundles that no longer exist after
    # a deploy and break the load.
    /index.html         "no-cache, no-store, must-revalidate";
    default             "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # No `always` here: a 404 under /_app/immutable/ must not be cached for a year.
    add_header Cache-Control $cache_control;

    # Fly terminates TLS and force_https redirects plain HTTP, so every browser
    # sees these over HTTPS. Same values as the API at api.vici.app.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Same policy as the web3 build of this app at vici.market.
    add_header Referrer-Policy "same-origin" always;
    # Nothing frames the app. X-Frame-Options covers browsers without CSP
    # frame-ancestors support.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /_app/immutable/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path serves index.html so client-side routing
    # and deep links / hard reloads resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
