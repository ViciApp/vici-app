<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Icons. SVG is preferred by modern browsers (sharp at every size);
			 the 32px PNG is a size-targeted fallback for older browsers. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/branding/vici-favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/branding/vici-favicon-32.png"
		/>
		<!-- iOS rejects SVG for the home-screen icon — needs a 180×180 PNG. -->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/branding/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<!--
			Capture `beforeinstallprompt` at the earliest possible point. Chrome fires
			it once, during initial load — before the app hydrates — so a listener
			registered later (when the app layout calls `initA2hs`) misses it and the
			in-app "Add to home screen" affordance never appears. Stash the deferred
			event here; `a2hs.store` adopts it on init.
		-->
		<script>
			window.addEventListener(
				'beforeinstallprompt',
				function (event) {
					event.preventDefault();
					window.__viciDeferredInstallPrompt = event;
				},
				{ once: true }
			);
		</script>

		<!--
			`minimum-scale=1` blocks pinch-zoom-OUT below device width — the app
			is tuned to device-width and zooming out just exposes background
			chrome. We intentionally do NOT set `maximum-scale` or
			`user-scalable=no` so users with low vision can still zoom IN on
			text content (Terms, Privacy, etc.).
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
		/>
		<meta name="application-name" content="VICI" />
		<meta name="apple-mobile-web-app-title" content="VICI" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Address-bar / status-bar tint. Dark default matches `--ink`; the
			 light-scheme override matches the parchment surface. -->
		<meta name="theme-color" content="#0e0d0b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f2ecdc" media="(prefers-color-scheme: light)" />
		<meta name="color-scheme" content="dark light" />

		<meta
			name="description"
			content="VICI is a consumer-first prediction market. Forecast sports, crypto, politics and culture outcomes on live community odds, build a reputation, and earn XP."
		/>
		<link rel="canonical" href="https://vici.market/" />

		<!-- Site-wide structured data (schema.org). Organization + WebSite
			 apply to every page; per-market and per-topic JSON-LD is injected
			 on top by scripts/build/generate-seo-assets.ts at deploy time.
			 Do NOT write literal head-tag markup (the title or description-meta
			 openers) into this block or its comments: the generator counts those
			 patterns in the built shell and hard-fails on a second match. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "Organization",
						"@id": "https://vici.market/#org",
						"name": "VICI",
						"url": "https://vici.market/",
						"logo": "https://vici.market/branding/og-image.png"
					},
					{
						"@type": "WebSite",
						"@id": "https://vici.market/#website",
						"name": "VICI",
						"url": "https://vici.market/",
						"publisher": { "@id": "https://vici.market/#org" },
						"description": "VICI is a consumer-first prediction market — forecast sports, crypto, politics and culture outcomes on live community odds."
					}
				]
			}
		</script>

		<!-- Open Graph / Twitter. The og:image is a 1200×630 raster rendered
			 from the brand SVGs (wordmark on the ink canvas + tagline). Twitter
			 card upgraded to `summary_large_image` to honour it.

			 Deploy-time contract: `scripts/build/generate-seo-assets.ts` rewrites
			 the title tag, description meta, canonical link, the og:
			 type/url/title/description tags and the twitter: title/description
			 tags into per-market copies of the built shell. Renaming or
			 restructuring these tags breaks its patterns — the deploy fails
			 loudly, but keep them in sync. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="VICI" />
		<meta property="og:url" content="https://vici.market/" />
		<meta property="og:title" content="VICI — Predict at the speed of thought" />
		<meta property="og:description" content="Forecast outcomes, build a reputation, and earn XP." />
		<meta property="og:image" content="https://vici.market/branding/og-image.png" />
		<meta property="og:image:secure_url" content="https://vici.market/branding/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="VICI — Predict at the speed of thought." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="VICI — Predict at the speed of thought" />
		<meta
			name="twitter:description"
			content="Forecast outcomes, build a reputation, and earn XP."
		/>
		<meta name="twitter:image" content="https://vici.market/branding/og-image.png" />
		<meta name="twitter:image:alt" content="VICI — Predict at the speed of thought." />

		<script>
			// No-FOUC theme bootstrap. Read the saved theme synchronously
			// before the first paint and stamp `data-theme` on <html> so
			// the per-theme tokens in app.css cascade immediately. The
			// theme.store will re-set the same attribute on hydrate; the
			// idempotent write is a no-op. Falls through to the `:root`
			// (dark) defaults when no value is stored or storage is
			// blocked.
			(function () {
				try {
					var t = localStorage.getItem('vici-theme');
					if (t === 'dark' || t === 'light' || t === 'peach') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();

			// Pre-paint iOS flag. Stamp `data-ios` on <html> so landing CSS can
			// drop the live backdrop-filter blur on the nav pill: iOS WebKit
			// (every iOS browser, Chrome included) re-rasterizes a blur pinned
			// over scrolling content every frame and it flickers. iPadOS reports
			// as "MacIntel" with a touch screen, so check maxTouchPoints too.
			(function () {
				try {
					var ua = navigator.userAgent || '';
					var isIOS =
						/iP(ad|hone|od)/.test(ua) ||
						(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
					if (isIOS) {
						document.documentElement.setAttribute('data-ios', '');
						// Standalone / PWA mode (added to Home Screen) has NO browser
						// bottom bar, so the inset would just push docked footers up
						// for nothing — detect it via the legacy `navigator.standalone`
						// (iOS-only) plus the standard display-mode media query.
						var standalone =
							(window.navigator && window.navigator.standalone === true) ||
							(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
						// Every iOS browser draws a NATIVE bottom bar over the web
						// view: the Chrome/Firefox/Edge/Google-app toolbars AND
						// Safari's own bottom bar (confirmed on device — it overlays
						// docked modal footers the same way). The page renders UNDER
						// it and no web API (visualViewport / dvh / svh /
						// safe-area-inset) reports its height, so a bottom-docked CTA
						// gets clipped. Stamp the flag for ALL iOS browsers — but NOT
						// standalone/PWA, which has no browser bar — so CSS can add
						// `--ios-bottom-bar-inset` to docked footers.
						if (!standalone) {
							document.documentElement.setAttribute('data-ios-bottom-bar', '');
						}
					}
				} catch (e) {
					/* non-iOS fallthrough is fine */
				}
			})();

			// Flash-free locale boot. Runs before the first paint so
			// <html lang>, dir, and [data-locale] are correct on the first
			// frame — the static-host equivalent of SSR locale negotiation.
			// A saved choice wins instantly; otherwise the device language
			// seeds it. The i18n layer re-resolves authoritatively after
			// hydrate, so a stale/missing value just falls through here.
			// RTL languages (ar/he/fa/ur) get dir="rtl".
			(function () {
				try {
					var RTL = ['ar', 'he', 'fa', 'ur'];
					var saved = null;
					try {
						var raw = localStorage.getItem('vici.locale.v1');
						saved = raw ? JSON.parse(raw) : null;
					} catch (e) {}
					var loc = saved;
					if (!loc) {
						var navs =
							navigator.languages && navigator.languages.length
								? navigator.languages
								: [navigator.language || 'en'];
						loc = navs[0] || 'en';
					}
					var lang = String(loc).split('-')[0].toLowerCase();
					var el = document.documentElement;
					el.setAttribute('lang', loc);
					el.setAttribute('data-locale', loc);
					el.setAttribute('dir', RTL.indexOf(lang) >= 0 ? 'rtl' : 'ltr');
				} catch (e) {
					/* defaults in markup are fine */
				}
			})();
		</script>

		%sveltekit.head%

		<title>VICI</title>

		<!-- Fonts are fully self-hosted (see the `@font-face` block in
			 `app.css` — files under `static/fonts/`). No Google Fonts
			 stylesheet: the extra origin's DNS/TLS + render-blocking CSS
			 fetch cost ~600ms on a cold mobile load, and its declarations
			 shadowed the self-hosted faces for overlapping weights. -->
		<link
			rel="preload"
			href="/fonts/hanken-grotesk-variable-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div
				style="
					background: #0e0d0b;
					color: #f2ecdc;
					min-height: 100vh;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 2rem;
					font-family: 'Hanken Grotesk', system-ui, sans-serif;
					text-align: center;
				"
			>
				<div style="max-width: 28rem">
					<div
						style="
							font-weight: 700;
							letter-spacing: 0.18em;
							font-size: 1.5rem;
							color: #e2b842;
							margin-bottom: 1rem;
						"
					>
						VICI
					</div>
					<p style="line-height: 1.5; margin: 0">
						VICI requires JavaScript to run. Enable JavaScript in your browser and reload the page.
					</p>
				</div>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
