name: Dependabot Bun Lockfile

# Dependabot supports bun for version updates but NOT for security updates
# (https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories),
# and a backend security alert opens its PR regardless of dependabot.yml. Such
# a PR bumps backend/package.json and leaves backend/bun.lock stale, which
# breaks `bun install --frozen-lockfile` in Backend Checks and in the Fly image
# build (see #1242 then #1245). This job regenerates the lockfile in place so
# the security PR is mergeable on its own.
#
# `pull_request_target` is deliberate: a workflow triggered by Dependabot
# through `pull_request` gets a read-only token and no secrets, so it cannot
# push the fix back. That makes the job privileged, so it never checks out the
# PR: the workflow definition and the Bun pin come from the base branch, the
# PR's backend/package.json and backend/bun.lock are fetched as data and only
# ever read by `bun install --lockfile-only` (which resolves the registry
# without installing packages or running any lifecycle script), and the result
# is committed through the API rather than by git in a PR-controlled tree.

on:
  pull_request_target:
    paths:
      - 'backend/package.json'

permissions: {}

concurrency:
  group: dependabot-bun-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bun-image:
    # Same-repo Dependabot branches only: a fork cannot be pushed to, and a
    # human-authored PR is expected to carry its own lockfile. `regenerate`
    # needs this job, so it is skipped with it.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/backend-bun-image.yml
    permissions:
      contents: read

  regenerate:
    needs: ['bun-image']
    runs-on: ubuntu-24.04
    # Nothing uses GITHUB_TOKEN here; every API call runs on the short-lived
    # app installation token minted below, which is what gets Backend Checks
    # to re-run on the fixed head.
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # No checkout: the workspace holds only these two files, at their
      # repository paths, so the PR's code is never on disk for a step to run.
      - name: Fetch the manifest and lockfile from the pull request head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p backend
          for file in backend/package.json backend/bun.lock; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${HEAD_SHA}" \
              > "$file"
          done
          cp backend/bun.lock "${RUNNER_TEMP}/bun.lock.before"

      # Resolved inside the same pinned image Backend Checks runs, so the
      # lockfile written here is byte-identical to the one that job then
      # verifies with `--frozen-lockfile`. bun needs nothing else from backend/
      # to resolve (bunfig.toml only configures tests). The image is not the
      # job `container:` because it ships without the gh CLI the other steps
      # need.
      - name: Regenerate bun.lock
        env:
          BUN_IMAGE: ${{ needs.bun-image.outputs.image }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/backend:/workspace" \
            --workdir /workspace \
            "$BUN_IMAGE" \
            bun install --lockfile-only

      # `createCommitOnBranch` replaces only bun.lock on top of the head commit
      # and is a compare-and-swap on `expectedHeadOid`: if the branch moved
      # since this run started (a new push, or a reset to an ancestor), the
      # mutation is refused instead of writing over that state, and the run
      # the move triggered repairs the new head.
      - name: Commit the regenerated lockfile onto the pull request branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if cmp -s "${RUNNER_TEMP}/bun.lock.before" backend/bun.lock; then
            echo 'backend/bun.lock already matches backend/package.json.'
            exit 0
          fi
          base64 -w0 backend/bun.lock > "${RUNNER_TEMP}/bun.lock.b64"
          commit="$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --rawfile contents "${RUNNER_TEMP}/bun.lock.b64" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  expectedHeadOid: $head,
                  message: { headline: "chore(backend-deps): regenerate bun.lock for the dependency bump" },
                  fileChanges: { additions: [{ path: "backend/bun.lock", contents: $contents }] }
                }
              }
            }' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid)"
          echo "Committed ${commit} onto ${HEAD_REF}."
