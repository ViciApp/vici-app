# Please see the documentation for all configuration options:
# https://docs.github.com/en/enterprise-cloud@latest/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(github-actions): '
    cooldown:
      default-days: 7

  # Dependabot runs npm through corepack, so it uses the version pinned in
  # package.json#packageManager. Without that pin it picks its own default,
  # and npm 12 trips engine-strict on @dfinity/eslint-config-oisy-wallet
  # (npm <12), failing every npm update as "can't resolve dependency files".
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(npm-deps): '
      prefix-development: 'chore(npm-deps-dev): '
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    groups:
      lint-kit:
        patterns:
          - '@dfinity/eslint-config-oisy-wallet'
          - '@types/eslint'
          - 'eslint'
          - 'eslint-config-prettier'
          - 'eslint-plugin-svelte'
          - 'typescript-eslint'
          - 'globals'
      juno-kit:
        patterns:
          - '@junobuild/config'
          - '@junobuild/vite-plugin'
          - '@junobuild/core'
          - '@junobuild/functions'
          - '@junobuild/schema'

  # The backend is a standalone Bun project with its own bun.lock. It is not a
  # workspace of the root package.json, so the npm entry above never sees it.
  # Dependabot supports bun for VERSION updates only; its SECURITY updates
  # still open package.json-only PRs that leave bun.lock stale, which is what
  # .github/workflows/dependabot-bun-lock.yml repairs.
  # https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
  - package-ecosystem: bun
    directory: '/backend'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(backend-deps): '
      prefix-development: 'chore(backend-deps-dev): '
    cooldown:
      default-days: 7
    allow:
      - dependency-type: all
    # The noble/scure crypto primitives version-lock each other and pin API
    # shapes the custody code depends on; a lone major bump can resolve into a
    # mixed v1/v2 tree that only breaks in the pruned production install.
    # Majors here ride deliberate upgrade PRs instead.
    ignore:
      - dependency-name: '@noble/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@scure/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'micro-packed'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
