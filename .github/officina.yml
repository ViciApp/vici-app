# Officina project config: how agents may work on this repository.
# Officina reads this file from the default branch; a push that changes it refreshes the stored copy.
# Lanes are decided by the paths a change really touches, read from the diff, not from what an agent claims.
version: 1

docs:
  entry: AGENTS.md
  spec_template: docs/ai/spec-driven-development/template.md
  spec_dir: docs/ai/spec-driven-development/specs
  pr_template: .github/pull_request_template.md

# Same rule as the pr-title check in checks.yml: the builder's pull request title must match it.
pull_request:
  title_pattern: '^(feat|fix|perf|deps|revert|docs|style|chore|refactor|test|build|ci)\([-a-zA-Z0-9,._/]+\)!?: .+$'

# What a merge into main deploys: nothing. Releases run from `v*` tags (deploy.yml, publish.yml),
# cut when a person merges the release-please PR; web2-deploy.yml is started by hand.
release:
  on_merge: nothing

setup: ['npm ci', 'npm run prepare', 'bun install --cwd backend --frozen-lockfile']
# The CI gates an agent sandbox can run. Left to CI: the backend `bun test` (ten DB suites do not
# skip without Postgres yet) and `satellite-schema` (needs a global Juno CLI, and any drift it finds
# lands in src/satellite/**, a red path the builder may not touch).
verify: ['npm run quality', 'npm run check', 'npm test', 'bun run --cwd backend typecheck']

lanes:
  # Agents never build in the red lane: they may write the spec, a person implements it.
  red:
    agents_build: false
    approvals:
      spec_review: [{ role: owner }]
    paths:
      # Protected paths, see docs/ai/governance.md#boundaries
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'dfx.json'
      # Not in the tree today (canister_ids.json untracked, static/workers/** gitignored and copied
      # by postinstall); listed so a change that adds either still lands here.
      - 'canister_ids.json'
      - 'static/workers/**'
      - 'juno.config.ts'
      - 'juno.collections.json'
      - 'src/satellite/**'
      - 'src/declarations/**'
      - 'eslint.config.js'
      - '.prettierrc'
      - 'tsconfig*.json'
      - 'local-rules/**'
      - 'scripts/build/**'
      - 'scripts/lib/**'
      - 'scripts/init/**'
      # Root scripts deploy canisters, move tokens, run as the dfx identity or gate CI and releases
      # (deploy.sh, send.tokens.sh, restart.*.sh, *-markets.sh, did.sh, satellite-upgrade-needed.mjs)
      - 'scripts/*'
      - 'scripts/test/**'
      # Toolchain, lint, release and hosting policy
      - '.npmrc'
      - '.node-version'
      - '.prettierignore'
      - 'eslint-local-rules.cjs'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
      - 'nginx.web.conf'
      - 'static/google*.html'
      # Agent instructions
      - '.agents/**'
      - '.claude/**'
      # Deploy configuration, including the root web build (fly.web.toml, Dockerfile.web)
      - 'fly*.toml'
      - 'Dockerfile*'
      # Money, identity and legal copy
      - 'src/lib/constants/vxp-economy.constants.ts'
      - 'src/lib/constants/vxp-onboarding.constants.ts'
      - 'src/lib/constants/flow-rewards.constants.ts'
      - 'src/lib/constants/legal-docs.constants.ts'
      # Canister, ledger and engine ids, satellite controllers and role permissions
      - 'src/lib/constants/canisters.constants.ts'
      - 'src/lib/constants/tokens/tokens.ic.constants.ts'
      - 'src/lib/constants/icdc.constants.ts'
      - 'src/lib/constants/controllers.constants.ts'
      - 'src/lib/constants/authz.constants.ts'
      - 'src/lib/components/authn/**'
      - 'src/lib/services/identity*.ts'
      - 'src/lib/schema/auth-identity.schema.ts'
      # Web2 backend: auth, custody, chains, VXP, engine, schema and deploy
      - 'backend/package.json'
      - 'backend/bun.lock'
      - 'backend/Dockerfile'
      - 'backend/fly*.toml'
      - 'backend/docker-compose.yml'
      - 'backend/bunfig.toml'
      - 'backend/tsconfig.json'
      - 'backend/src/env.ts'
      - 'backend/src/auth/**'
      - 'backend/src/admin/**'
      - 'backend/src/account/**'
      # Entry points that issue sessions, move value or expose admin surfaces
      - 'backend/src/routes/auth.ts'
      - 'backend/src/routes/account.ts'
      - 'backend/src/routes/admin.ts'
      - 'backend/src/routes/claim.ts'
      - 'backend/src/routes/engine.ts'
      - 'backend/src/routes/vxp.ts'
      - 'backend/src/routes/wallet.ts'
      # Session, key and abuse-protection primitives
      - 'backend/src/lib/cookie.ts'
      - 'backend/src/lib/crypto.ts'
      - 'backend/src/lib/keys.ts'
      - 'backend/src/lib/rate-limit.ts'
      - 'backend/src/lib/email.ts'
      - 'backend/src/lib/ic-agent.ts'
      - 'backend/src/custody/**'
      - 'backend/src/chains/**'
      - 'backend/src/vxp/**'
      - 'backend/src/engine/**'
      - 'backend/src/db/**'
      - 'backend/src/declarations/**'
      # Legacy data migration and the test-only server with its fake engine and seed
      - 'backend/scripts/etl/**'
      - 'backend/e2e/**'

  standard:
    paths: ['**']
    wip: 3
    diff_lines: 800
    budget_usd: 25
    approvals:
      spec_review: [{ role: owner }]
      verifying: [{ domain: product, when: user_visible }, { role: owner }]

  # User-facing copy only. A requirement nobody can meet yet (no product approver) is waived
  # automatically and recorded as waived, so this works today and tightens when the role is filled.
  # auto_verify: a result the chooser judges needs no more than a glance merges without a person's
  # check, which is allowed because a merge ships nothing (release.on_merge). People still approve
  # the spec, and the branch rules (checks, threads, code-owner review) still decide the merge.
  green:
    paths: ['src/lib/constants/messages/**']
    auto_verify: true
    wip: 5
    diff_lines: 600
    budget_usd: 5
    approvals:
      spec_review: [{ requester: true }, { domain: product }]
      verifying: [{ requester: true }]
