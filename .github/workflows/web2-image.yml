name: Web2 Image

# Builds the vici.app SPA image exactly as web2-deploy.yml ships it and
# smoke-tests the container, so a Dockerfile.web that only breaks inside
# Docker fails on the PR instead of on the manual deploy. Nothing is pushed.
# Deliberately unfiltered: almost any file can reach the image through
# `COPY . .`, and a hand-kept path list silently rots.
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

# A newer PR push supersedes the running build; a main run is never cancelled
# mid-build, so a merged commit is not left without a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fly.web.toml is what `flyctl deploy` reads, so the Dockerfile and build
      # args come from it rather than from literals here that could drift. The
      # Node version comes from .node-version, as web2-deploy.yml passes it.
      - name: Read build config from fly.web.toml
        id: fly
        run: |
          python3 - <<'PY'
          import os, tomllib

          with open("fly.web.toml", "rb") as f:
              build = tomllib.load(f)["build"]
          with open(".node-version") as f:
              node_version = f.read().strip()
          args = {**build["args"], "NODE_VERSION": node_version}

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"dockerfile={build['dockerfile']}\n")
              out.write(f"api-url={args['VITE_WEB2_API_URL']}\n")
              out.write("build-args<<BUILD_ARGS_EOF\n")
              for key, value in args.items():
                  out.write(f"{key}={value}\n")
              out.write("BUILD_ARGS_EOF\n")
          PY

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `context: .` builds the checked-out tree like `flyctl deploy` does; the
      # action's default git context would skip local files and need a token.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.fly.outputs.dockerfile }}
          build-args: ${{ steps.fly.outputs.build-args }}
          tags: vici-app-web:ci
          load: true
          push: false
          cache-from: type=gha,scope=web2-image
          cache-to: type=gha,mode=max,scope=web2-image

      - name: Smoke test the container
        env:
          IMAGE: vici-app-web:ci
          API_URL: ${{ steps.fly.outputs.api-url }}
        run: |
          set -euo pipefail

          # A stub API for the challenge-link preview include: a fragment for
          # ids starting with A, an empty 404 for anything else.
          cat >"$RUNNER_TEMP/stub.conf" <<'NGINX'
          server {
              listen 80;
              default_type text/html;
              location ~ "^/api/v1/challenges/A[0-9A-Z]{15}/head$" {
                  return 200 '<title>STUB CHALLENGE | VICI</title>';
              }
              location / {
                  return 404;
              }
          }
          NGINX
          docker network create smoke >/dev/null
          docker run --detach --name stub --network smoke \
            --volume "$RUNNER_TEMP/stub.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine
          docker run --detach --name web --network smoke --publish 8080:8080 \
            --env CHALLENGE_HEAD_UPSTREAM=http://stub "$IMAGE"
          trap 'status=$?; (( status == 0 )) || docker logs web; docker rm --force web stub >/dev/null; docker network rm smoke >/dev/null' EXIT

          base=http://localhost:8080
          # Docker's port proxy accepts connections before nginx listens, so a
          # not-yet-ready container resets rather than refuses: retry any error.
          curl --silent --show-error --fail --retry 15 --retry-all-errors --retry-delay 1 --output /dev/null "$base/"

          expect_status() {
            local status
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base$1")
            if [[ "$status" != "$2" ]]; then
              echo "::error::GET $1 returned $status, expected $2"
              exit 1
            fi
            echo "GET $1 -> $2"
          }
          expect_200() {
            expect_status "$1" 200
          }

          expect_200 /
          # No file exists at /flow: a 200 proves the nginx SPA fallback works.
          expect_200 /flow

          # nginx drops inherited add_header in any location that sets its
          # own, so check one path per location block, plus a 404.
          expect_header() {
            local path=$1 name=$2 value=$3 headers
            headers=$(curl --silent --output /dev/null --dump-header - "$base$path" | tr -d '\r')
            if ! grep --quiet --ignore-case --line-regexp --fixed-strings "$name: $value" <<<"$headers"; then
              echo "::error::GET $path lacks '$name: $value'. Got:"
              echo "$headers"
              exit 1
            fi
          }
          expect_security_headers() {
            expect_header "$1" Strict-Transport-Security 'max-age=63072000; includeSubDomains'
            expect_header "$1" X-Content-Type-Options nosniff
            expect_header "$1" Referrer-Policy same-origin
            expect_header "$1" X-Frame-Options DENY
            expect_header "$1" Content-Security-Policy "frame-ancestors 'none'"
            echo "GET $1 -> security headers present"
          }
          immutable_asset=$(docker exec web sh -c 'cd /usr/share/nginx/html && find _app/immutable -type f -name "*.js" | head -n 1')
          if [[ -z "$immutable_asset" ]]; then
            echo "::error::No JS file under /_app/immutable in the image"
            exit 1
          fi
          # A miss under /_app/immutable/ must 404, not fall back to the shell.
          expect_status /_app/immutable/missing.js 404
          challenge=/c/AAAAAAAAAAAAAAAA
          for path in / /flow /index.html "/$immutable_asset" /_app/immutable/missing.js "$challenge"; do
            expect_security_headers "$path"
          done
          expect_header / Cache-Control 'no-cache, no-store, must-revalidate'
          expect_header /flow Cache-Control 'no-cache, no-store, must-revalidate'
          expect_header /index.html Cache-Control 'no-cache, no-store, must-revalidate'
          expect_header "/$immutable_asset" Cache-Control 'public, max-age=31536000, immutable'

          # A challenge link: the shell with the API's head fragment in place
          # of the generic preview tags, never cached, never indexed; an id
          # the API does not know keeps the generic tags. No other path is
          # marked noindex.
          expect_header "$challenge" Cache-Control 'no-cache, no-store, must-revalidate'
          expect_header "$challenge" X-Robots-Tag 'noindex, nofollow'
          if curl --silent --dump-header - --output /dev/null "$base/" | grep --quiet --ignore-case '^x-robots-tag:'; then
            echo "::error::GET / carries an X-Robots-Tag"
            exit 1
          fi
          challenge_head=$(curl --silent --fail "$base$challenge")
          if ! grep --quiet --fixed-strings '<title>STUB CHALLENGE | VICI</title>' <<<"$challenge_head" \
            || grep --quiet 'property="og:title"' <<<"$challenge_head"; then
            echo "::error::GET $challenge does not carry the stub fragment alone"
            exit 1
          fi
          unknown_head=$(curl --silent --fail "$base/c/BBBBBBBBBBBBBBBB")
          if ! grep --quiet 'property="og:title"' <<<"$unknown_head" || grep --quiet STUB <<<"$unknown_head"; then
            echo "::error::GET /c/BBBBBBBBBBBBBBBB does not fall back to the generic preview"
            exit 1
          fi
          if ! cmp --silent <(curl --silent "$base/") <(docker exec web cat /usr/share/nginx/html/index.html); then
            echo "::error::GET / differs from the built shell"
            exit 1
          fi
          echo "GET $challenge -> challenge preview, unknown id -> generic preview"

          # Globbed so a rotated Search Console token needs no workflow edit.
          shopt -s nullglob
          verification_files=(static/google*.html)
          if (( ${#verification_files[@]} == 0 )); then
            echo "::error::No Google Search Console verification file found in static/"
            exit 1
          fi
          for file in "${verification_files[@]}"; do
            name=$(basename "$file")
            expect_200 "/$name"
            curl --silent --fail "$base/$name" | grep --quiet --fixed-strings "google-site-verification: $name"
          done

          # Vite inlines VITE_* at build time; an empty or dropped build arg
          # would ship a bundle calling the wrong API with no runtime error.
          # An empty origin would match every file, and a production SPA must
          # call its API over TLS, so anything but a bare https origin fails.
          if [[ ! "$API_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::VITE_WEB2_API_URL in fly.web.toml must be an https origin, got '$API_URL'"
            exit 1
          fi
          if ! docker exec web grep -rlF "$API_URL" /usr/share/nginx/html/_app/immutable >/dev/null; then
            echo "::error::No built JS references $API_URL"
            exit 1
          fi
          echo "Built JS references $API_URL"

  web2-image-pass:
    if: always()
    needs: ['web-image']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
