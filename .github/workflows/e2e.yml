name: E2E

on:
  push:
    branches:
      - main
  pull_request:
    # `labeled` is needed so adding the `run-e2e-snapshots` label to a PR that
    # didn't touch e2e files retriggers the workflow under the opt-in path.
    types: [opened, synchronize, labeled]
  merge_group:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-e2e-changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      e2e-or-config-changed: ${{ steps.change.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: change
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || '' }}
          filters: |
            e2e:
              - playwright.config.ts
              - .github/workflows/e2e.yml
              - e2e/**/*
              # Deploy-chain inputs: `npm run deploy` (scripts/deploy.sh) brings
              # up the icdc-core canisters before Playwright runs, so a change
              # to the build/init args or dfx config can break the suite at the
              # deploy step. Watch them so such regressions surface on the PR,
              # not only on the post-merge push to main.
              - dfx.json
              - juno.config.ts
              - scripts/**/*

  e2e:
    runs-on: ubuntu-24.04
    # Bumped from 45 → 90: the full matrix (chromium + Galaxy S9+ + Galaxy
    # A55, with 2 retries on CI) on a fresh runner can take ~50–60 min once
    # the skylab image pull, dfx pulls, icdc-core init, and Playwright
    # downloads are added on top of the test wall-clock. Cancelling mid-run
    # at 45 also drops the playwright-report / test-results artifacts on
    # the floor, which makes any real diagnostic impossible.
    timeout-minutes: 90
    needs: check-e2e-changes
    # Skip the suite on PRs / merge-group when no E2E-relevant file changed,
    # unless the PR carries the `run-e2e-snapshots` opt-in label. Push / cron
    # / workflow_dispatch always run. The label leg is pull_request-only:
    # `merge_group` has no PR payload, and it could not commit a rewrite back
    # from the queue anyway.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'merge_group') ||
      (
        (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
        (
          needs.check-e2e-changes.outputs.e2e-or-config-changed == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'run-e2e-snapshots')
        )
      )
    permissions:
      contents: read
    env:
      # Swap juno.config.ts `ids.development` to the emulator's predictable
      # satellite ID (jx5yt-yyaaa-aaaal-abzbq-cai). Required because
      # `juno login --emulator` is only valid with `--mode development`.
      JUNO_EMULATOR: 'true'
      CI: 'true'

    steps:
      # On same-repo PRs, check out the actual head ref so any later snapshot
      # work in `finalize-snapshots-update` lands on the PR's tip rather than
      # the temporary merge commit GitHub creates. For pushes / merge_group /
      # fork PRs the default checkout is fine.
      - name: Checkout (same-repo PR head)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Checkout (default)
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print Chrome version
        run: google-chrome --version || true

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install Juno CLI
        # Pin to a known-good version. Bump deliberately when @junobuild/cli
        # ships a release we want to track; an unpinned `latest` would let
        # an upstream breaking change silently red the whole pipeline.
        run: npm i -g @junobuild/cli@0.15.6

      - name: Install dfx
        # Match the version pinned in dfx.json. dfx.json's `local` network
        # already points at 127.0.0.1:5987, which is exactly the port the
        # Juno emulator's PocketIC listens on, so `dfx deploy --network local`
        # works against the running emulator without extra plumbing.
        #
        # `pipefail` is needed so a failed `curl` doesn't get masked by a
        # successful `sh` exit — otherwise the step "succeeds" with no dfx
        # installed and the next step fails with a confusing PATH error.
        env:
          DFX_VERSION: '0.26.1'
          DFXVM_INIT_YES: 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://internetcomputer.org/install.sh | sh
          echo "$HOME/.local/share/dfx/bin" >> "$GITHUB_PATH"

      - name: Configure dfx identity
        # `dfx canister create / deploy` need a non-anonymous identity.
        # `--storage-mode plaintext` skips the keyring prompt that would
        # otherwise hang in CI; the identity is ephemeral to this runner.
        run: |
          set -euo pipefail
          dfx identity new --storage-mode plaintext --force ci-runner
          dfx identity use ci-runner

      - name: Start Juno emulator
        run: |
          set -euo pipefail
          juno emulator start --headless &
          juno emulator wait
          juno login --emulator --mode development --headless
          juno config apply --mode development --headless

      - name: Build & upgrade satellite functions
        # The bare junobuild/satellite image doesn't ship our app-specific
        # typed queries / hooks (defined in src/satellite/index.ts and
        # surfaced via $declarations/satellite/satellite.api). Without
        # this step, calls like `functions.getProfile()` 4xx on the
        # emulator and the auth flow rolls back to signed-out.
        run: |
          set -euo pipefail
          npm run juno:functions:build
          juno functions upgrade -m development --no-snapshot

      - name: Deploy icdc-core canisters
        # Mirrors the local `npm run deploy` flow: dfx pulls the icdc-core
        # WASMs from the AntonioVentilii/icdc-core, ViciApp/vici-points and ViciApp/vici-icrc
        # GitHub releases (see scripts/build/download.*.sh) and installs
        # them into the PocketIC instance the emulator is already running.
        # After this, the registry / clearing / vUSD / VXP / vici / cketh /
        # ckusdc canisters all live at their `specified_id` from dfx.json.
        run: npm run deploy

      - name: Initialize icdc-core (clearing + engine + registry)
        # Order matters: clearing wires domain policies, the engine must be
        # registered before markets, and registry seeds the demo markets the
        # home feed needs. `init.icdc-dev-bootstrap` is intentionally skipped:
        # CI signs in via the dev mock identity each run, so there is no
        # stable `DEV_CREATOR_PRINCIPAL` to pre-grant.
        run: |
          set -euo pipefail
          npm run init:clearing
          npm run init:icdc-engine
          npm run init:registry

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # Playwright runs with `--update-snapshots=changed`, so missing or
      # diffed baselines are written into `e2e/snapshots/` rather than
      # failing the test. Detect them here and ship the directory as an
      # artifact; `finalize-snapshots-update` (a separate job) owns
      # commit-back and PR-on-main.
      - name: Check if snapshots changed
        id: check_snapshots
        run: |
          if [ -n "$(git status --porcelain e2e)" ]; then
            echo "CHANGES=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGES=false" >> $GITHUB_OUTPUT
          fi

      - name: Save changed snapshots
        if: steps.check_snapshots.outputs.CHANGES == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Named with a `snapshots-*` prefix to match the download pattern
          # used by `finalize-snapshots-update`. The suffix is informational
          # — if/when this job gains a shard or OS matrix, append those to
          # the suffix to keep artifact names unique.
          name: snapshots-ubuntu-24.04
          path: e2e/snapshots/
          retention-days: 7

  finalize-snapshots-update:
    name: Finalize Snapshots Update
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    needs: [e2e]
    outputs:
      e2e-snapshots-changed: ${{ steps.e2e-check-snapshots.outputs.e2e-snapshots-changed }}
    # Don't run if the e2e job didn't run (skipped via paths filter) or was
    # cancelled. Failed e2e runs may still have produced snapshot artifacts
    # worth committing, so allow `failure()` through.
    if: ${{ needs.e2e.result == 'success' || needs.e2e.result == 'failure' }}

    steps:
      - name: Checkout (same-repo PR head)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Checkout (default)
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download All Snapshot Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snapshots-*
          merge-multiple: true
          path: e2e/snapshots

      - name: Check for Final Changes
        id: e2e-check-snapshots
        run: |
          if [ -n "$(git status --porcelain e2e)" ]; then
            echo "FINAL_CHANGES=true" >> $GITHUB_ENV
            echo "e2e-snapshots-changed=true" >> $GITHUB_OUTPUT
          else
            echo "FINAL_CHANGES=false" >> $GITHUB_ENV
            echo "e2e-snapshots-changed=false" >> $GITHUB_OUTPUT
          fi

      # Same-repo PR: push the snapshot update back onto the PR's head ref so
      # the diff lands in code review. Fork PRs are skipped because the
      # default `GITHUB_TOKEN` can't write to a fork.
      - name: Commit and push updates
        uses: ./.github/actions/add-and-commit
        if: >-
          env.FINAL_CHANGES == 'true' &&
          github.ref != 'refs/heads/main' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          add: e2e
          message: '🤖 chore(e2e): update Playwright snapshots'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Changes on main
        if: env.FINAL_CHANGES == 'true' && github.ref == 'refs/heads/main'
        run: git add e2e

      - name: Check the Changed Files
        if: env.FINAL_CHANGES == 'true' && github.ref == 'refs/heads/main'
        run: |
          MODIFIED_FILES=$(git diff --cached --name-only)
          echo "MODIFIED_FILES<<EOF" >> $GITHUB_ENV
          echo "$MODIFIED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Mint app token
        id: app-token
        if: env.FINAL_CHANGES == 'true' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # On `main`, the workflow can't push directly to a protected branch, so
      # open a follow-up PR with the snapshot diff.
      - name: Create Pull Request (if changes and on main)
        if: env.FINAL_CHANGES == 'true' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/create-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot-e2e-update-snapshots
          paths: e2e/
          title: 'chore(e2e): Update Playwright E2E Snapshots'
          body: |
            The following E2E snapshots have been updated:
            ```
            ${{ env.MODIFIED_FILES }}
            ```

  e2e-tests-pass:
    if: always()
    needs: [check-e2e-changes, e2e, finalize-snapshots-update]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Cleared for merging
        # Three exit paths:
        # 1. Paths filter skipped E2E entirely → clear to merge.
        # 2. E2E ran, succeeded, no snapshot drift → clear to merge.
        # 3. Anything else (failure, snapshot drift requiring re-review,
        #    cancellation) → block the merge.
        run: |
          if [ "$E2E_OR_CONFIG_CHANGED" == "false" ]; then
            echo "No E2E or config changes detected. PR is cleared for merging."
          elif [[ "$E2E_RESULT" == "success" ]] && [[ "$E2E_SNAPSHOTS_CHANGED" == "false" ]]; then
            echo "This PR is cleared for merging"
          else
            echo "This PR is not cleared for merging"
            exit 1
          fi
        env:
          E2E_OR_CONFIG_CHANGED: ${{ needs.check-e2e-changes.outputs.e2e-or-config-changed }}
          E2E_SNAPSHOTS_CHANGED: ${{ needs.finalize-snapshots-update.outputs.e2e-snapshots-changed }}
          E2E_RESULT: ${{ needs.e2e.result }}
