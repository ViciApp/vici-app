name: Checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

env:
  # One cache generation per main commit, pull request, queue entry or other
  # run; every job's restore-keys fall back to the newest main generation.
  CACHE_KEY_SUFFIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-{0}', github.sha) || github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      # This job checks out the pull request branch by name (apply-changes
      # commits onto it) on a workflow that also runs on push and dispatch,
      # so it saves no prettier or eslint cache: it only restores the ones
      # `lint` saves from the default checkout. Prepare's setup-node still
      # saves the npm cache in its post step.
      - name: Restore Prettier Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: ${{ runner.os }}-prettier-cache-lint-${{ env.CACHE_KEY_SUFFIX }}
          restore-keys: |
            ${{ runner.os }}-prettier-cache-lint-main-
            ${{ runner.os }}-prettier-cache-lint-

      - name: Restore ESLint Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-cache-lint-${{ env.CACHE_KEY_SUFFIX }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-lint-main-
            ${{ runner.os }}-eslint-cache-lint-

      - name: Format
        run: npm run format

      - name: Apply formatting changes
        uses: ./.github/actions/apply-changes
        with:
          paths: .
          commit-message: '🤖 Apply formatting changes'
          pr-branch: bot-format
          pr-title: 'style(format): apply formatting changes'
          pr-body: '`npm run format` changed files on `main`.'
          app-id: ${{ vars.PR_AUTOMATION_BOT_APP_ID }}
          app-private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          fix-hint: "Run 'npm run format' locally and commit the result."

  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Restore Prettier Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache/prettier/.prettier-cache
          key: ${{ runner.os }}-prettier-cache-lint-${{ env.CACHE_KEY_SUFFIX }}
          restore-keys: |
            ${{ runner.os }}-prettier-cache-lint-main-
            ${{ runner.os }}-prettier-cache-lint-

      - name: Restore ESLint Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-cache-lint-${{ env.CACHE_KEY_SUFFIX }}
          restore-keys: |
            ${{ runner.os }}-eslint-cache-lint-main-
            ${{ runner.os }}-eslint-cache-lint-

      - name: Lint
        run: npm run lint

  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Check
        run: npm run check

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      # Pure-logic specs under src/tests/ on Node's built-in runner (tsx --test).
      - name: Test
        run: npm test

  checks-pass:
    if: always()
    needs: ['format', 'lint', 'check', 'test']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
