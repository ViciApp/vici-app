# VICI SPA (static, nginx) on Fly.io, served at vici.app. Sibling to the
# backend app (vici-app-backend, api.vici.app); see Dockerfile.web. Deployed by
# the manual workflow .github/workflows/fly-deploy.yml.
app = "vici-app-web"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    VITE_API_URL = "https://api.vici.app"
    # Public Cloudflare Turnstile site key for the bot check on the anonymous
    # endpoints (the backend holds the matching TURNSTILE_SECRET_KEY). The
    # widget is "vici.app" in Cloudflare, managed mode, for vici.app and
    # www.vici.app only.
    VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAGVm_fKJeaGzJzq8"

# Keep one machine warm: the SPA gets no benefit from scale-to-zero, and a
# cold-stopped machine that wedges is invisible to Fly without a health check.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

# nginx serves index.html on `/` (HTTP 200), so `/` doubles as the liveness probe.
[[http_service.checks]]
  method = "get"
  path = "/"
  interval = "15s"
  timeout = "2s"
